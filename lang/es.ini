menu.item.aa.desc = FXAA suaviza los bordes dentados. Cuesta muy poco, pero la imagen queda un poco más suave.
menu.item.aa.name = Anti-aliasing
menu.item.aniso.desc = Mantiene nítidos suelos y paredes vistos en ángulo. Más alto se ve mejor, con un pequeño costo.
menu.item.aniso.name = Filtro anisotrópico
menu.item.ch_hp.desc = Truco: Kratos no recibe daño de enemigos ni trampas.
menu.item.ch_hp.name = Vida infinita
menu.item.ch_mp.desc = Truco: la barra de magia se mantiene llena al usar los poderes de los dioses.
menu.item.ch_mp.name = Magia infinita
menu.item.ch_rage.desc = Truco: la Ira de los Dioses / Titanes sigue activa sin gastar la barra.
menu.item.ch_rage.name = Furia infinita
menu.item.close.desc = Vuelve al juego. B o R + Plus también cierran el menú.
menu.item.close.name = Cerrar menú
menu.item.counter.desc = Muestra los cuadros por segundo en una esquina de la pantalla.
menu.item.counter.name = Contador de FPS
menu.item.dither.desc = Suaviza las franjas de color visibles en el cielo, la niebla y las sombras. Costo bajo.
menu.item.dither.name = Debanding
menu.item.exit.desc = Cierra el juego. Lo que no hayas guardado en el juego se pierde.
menu.item.exit.name = Salir del juego
menu.item.fgen.desc = Crea cuadros intermedios para que 30 FPS parezcan 60. Solo en God of War I con deko3d.
menu.item.fgen.name = Generación de cuadros
menu.item.fgflow.desc = Precisión con la que la generación de cuadros sigue el movimiento. Valores menores pesan menos en la GPU.
menu.item.fgflow.name = Flujo de generación
menu.item.fps.desc = Límite de cuadros. 30 es más estable y ahorra batería; 60 o Máximo es más fluido. El juego no se acelera.
menu.item.fps.name = Tasa de cuadros
menu.item.gamma.desc = Brillo general de la imagen. Súbelo si te cuesta ver las zonas oscuras.
menu.item.gamma.name = Brillo
menu.item.gpudiag.desc = Para reportar errores: guarda los tiempos de los gráficos en el log. Hace el juego mucho más lento.
menu.item.gpudiag.name = Diagnóstico de GPU (log)
menu.item.hpbars.desc = Muestra cuánta vida le queda a cada enemigo.
menu.item.hpbars.name = Barras de vida enemigas
menu.item.lang.desc = Idioma del launcher y del mod menu. Puedes agregar traducciones en data/traducoes/ de la SD.
menu.item.lang.name = Idioma
menu.item.launcher.desc = Cierra el juego y abre el launcher. Lo que no hayas guardado en el juego se pierde.
menu.item.launcher.name = Volver al launcher
menu.item.preset.desc = Ajusta resolución y cuadros por segundo a la vez: Rendimiento, Equilibrado o Calidad. Sin reiniciar.
menu.item.preset.name = Preset rápido
menu.item.qte.desc = Los botones que aparecen en pantalla (quick-time events) se completan solos.
menu.item.qte.name = QTE automático
menu.item.res.desc = Detalle de la imagen 3D en portátil. Más alta se ve más nítida, pero puede bajar los FPS y gastar más batería.
menu.item.res.name = Resolución (portátil)
menu.item.res_dock.desc = Detalle de la imagen 3D en la TV. "Igual al portátil" copia el ajuste de portátil.
menu.item.res_dock.name = Resolución (en TV)
menu.item.reset.desc = Devuelve los ajustes de imagen y color a sus valores por defecto. Resolución y cuadros se mantienen.
menu.item.reset.name = Restablecer valores
menu.item.sat.desc = Intensidad de los colores. Más alto se ve más vivo, más bajo se ve más apagado.
menu.item.sat.name = Saturación
menu.item.sharp.desc = Nitidez extra con FSR. Más alto se ve más definido, pero puede crear contornos claros. Desactivada usa el valor de AMD.
menu.item.sharp.name = Nitidez (RCAS)
menu.item.tex.desc = Usa texturas remasterizadas más nítidas del paquete en data/texpack, si está instalado.
menu.item.tex.name = Texturas HD
menu.item.upscale.desc = Cómo se agranda la imagen a la pantalla. FSR 1.0 se ve más nítido; Bilinear es más suave.
menu.item.upscale.name = Escalador
menu.item.vib.desc = Aviva los colores apagados sin exagerar los que ya son intensos.
menu.item.vib.name = Vibrancia
menu.item.vsync.desc = Evita el tearing (imagen cortada en dos). Mejor dejarlo activado.
menu.item.vsync.name = VSync

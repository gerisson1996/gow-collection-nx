menu.item.launcher.desc = Fecha o jogo e abre o launcher. O que não foi salvo no jogo é perdido.
menu.item.launcher.name = Voltar ao launcher
menu.item.preset.desc = Ajusta resolução e taxa de quadros de uma vez: Desempenho, Equilibrado ou Qualidade. Sem reiniciar.
menu.item.preset.name = Preset rápido
menu.item.qte.desc = Os comandos de botão na tela (quick-time events) são feitos automaticamente para você.
menu.item.qte.name = QTE automático
menu.item.res.desc = Detalhe da imagem 3D no portátil. Mais alta fica mais nítida, mas pode baixar o FPS e gastar mais bateria.
menu.item.res.name = Resolução (portátil)

menu.item.res_dock.name = Resolução (na TV)
menu.item.reset.desc = Volta as opções de imagem e cor ao padrão. Resolução e taxa de quadros ficam como estão.
menu.item.reset.name = Restaurar padrões
menu.item.sat.desc = Intensidade das cores. Mais alto fica mais vivo, mais baixo fica mais desbotado.
menu.item.sat.name = Saturação
menu.item.sharp.desc = Nitidez extra com o FSR. Mais alto fica mais definido, mas pode criar contornos claros. Desligada usa o padrão da AMD.
menu.item.sharp.name = Nitidez (RCAS)
menu.item.tex.desc = Usa texturas remasterizadas mais nítidas do pacote em data/texpack, se estiver instalado.
menu.item.tex.name = Texturas HD
menu.item.upscale.desc = Como a imagem é ampliada para a tela. FSR 1.0 fica mais nítido; Bilinear é mais suave.
menu.item.upscale.name = Upscaler
menu.item.vib.desc = Realça as cores apagadas sem exagerar nas que já são fortes.
menu.item.vib.name = Vibrância
menu.item.vsync.desc = Evita o tearing (imagem cortada em duas). Melhor deixar ligado.
menu.item.vsync.name = VSync

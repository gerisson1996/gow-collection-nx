name: Build Launcher (gow-nx.nro)

on:
  push:
    branches: [main, 'feat/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string embedded in gow-nx.nro (defaults to 1.3 or tag)'
        required: false
        default: ''
      publish_release:
        description: 'Publish gow-nx.nro to the rolling launcher-latest GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Compile gow-nx.nro (devkitA64)
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Switch portlibs
        run: |
          for attempt in 1 2 3; do
            dkp-pacman -Syy --noconfirm --needed \
              switch-freetype switch-harfbuzz switch-bzip2 switch-libpng \
              switch-zlib switch-mpg123 switch-curl switch-mbedtls && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "dkp-pacman attempt $attempt failed; retrying in 5s..."
            sleep 5
          done

      - name: Build launcher
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VER="${INPUT_VERSION#v}"
          elif [ "$REF_TYPE" = "tag" ]; then
            VER="${REF_NAME#v}"
          else
            VER="1.3"
          fi
          VERSION="$VER" bash launcher/build.sh
          sha256sum build/gow-nx.nro > build/gow-nx.nro.sha256

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: gow-nx-launcher
          path: |
            build/gow-nx.nro
            build/gow-nx.nro.sha256
          if-no-files-found: error

  release:
    name: Publish launcher to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' && (
        startsWith(github.ref, 'refs/tags/v') ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
      )
    permissions:
      contents: write
    steps:
      - name: Download launcher artifact
        uses: actions/download-artifact@v4
        with:
          name: gow-nx-launcher
          path: dist

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/gow-nx.nro dist/gow-nx.nro.sha256 --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/gow-nx.nro dist/gow-nx.nro.sha256 \
              --repo "$REPO" \
              --title "$TAG (Launcher)" \
              --notes "Automated launcher build (\`gow-nx.nro\`). Does not include game files or \`gow1.nro\`/\`gow2.nro\`."
          fi

      - name: Publish rolling launcher prerelease
        if: "!startsWith(github.ref, 'refs/tags/v')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          TAG="launcher-latest"
          NOTES="Automated launcher build (\`gow-nx.nro\`) from commit \`${SHA:0:7}\`. Place optional \`bg.bgra\` and \`music.mp3\` next to \`gow-nx.nro\` on the SD card. Does not include game files or \`gow1.nro\`/\`gow2.nro\`."
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --notes "$NOTES" --prerelease --latest=false
            gh release upload "$TAG" dist/gow-nx.nro dist/gow-nx.nro.sha256 --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/gow-nx.nro dist/gow-nx.nro.sha256 \
              --repo "$REPO" \
              --title "Launcher (latest build)" \
              --notes "$NOTES" \
              --prerelease \
              --latest=false
          fi
